# Build the Play Store bundle (.aab), signed with the upload key.
#
# This is the deliberate step android-apk.yml leaves out: that workflow makes a
# debug APK for sideloading; this one makes what Google Play accepts. It runs
# only when someone with write access presses "Run workflow" — never on a push —
# because each run produces something publishable as VegDrop.
#
# It needs four repository secrets (Settings → Secrets and variables →
# Actions):
#
#   ANDROID_UPLOAD_KEYSTORE_BASE64   the .jks file, base64-encoded
#   ANDROID_UPLOAD_STORE_PASSWORD    the keystore password
#   ANDROID_UPLOAD_KEY_ALIAS         the key's alias (e.g. upload)
#   ANDROID_UPLOAD_KEY_PASSWORD      the key password
#
# The key is decoded into the runner's temp directory for the one build step
# and deleted afterwards. It is never uploaded as an artifact: this repository
# is public, and its artifacts can be downloaded by people outside it.
#
# Google holds the real app-signing key (Play App Signing); this is only the
# upload key, so losing it is recoverable through Play Console support. Leaking
# it is worse: until it is reset, whoever holds it can upload builds as you.
name: Build Android release (Play Store)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version people see in Play, e.g. 1.0.3 (blank = 1.0.<run number>)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      # First, so a missing secret fails in two seconds with its name, not after
      # ten minutes of build with Gradle's "keystore not found".
      - name: Check the signing secrets are set
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$KEYSTORE_B64" ] || missing+=(ANDROID_UPLOAD_KEYSTORE_BASE64)
          [ -n "$STORE_PASSWORD" ] || missing+=(ANDROID_UPLOAD_STORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(ANDROID_UPLOAD_KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ] || missing+=(ANDROID_UPLOAD_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      # Same toolchain as android-apk.yml, for the same reasons given there.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - run: npm run android:sync

      - name: Decode the upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d >"$RUNNER_TEMP/upload.jks"

      # versionCode is the run number: Play rejects any upload whose code is not
      # higher than every earlier one, and the run number only ever goes up.
      - name: Build the signed bundle
        working-directory: android
        env:
          VEGDROP_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          VEGDROP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          VEGDROP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          VEGDROP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          VEGDROP_VERSION_CODE: ${{ github.run_number }}
          VEGDROP_VERSION_NAME: ${{ inputs.version_name || format('1.0.{0}', github.run_number) }}
        run: bash ./gradlew bundleRelease --no-daemon

      # An unsigned bundle builds without complaint and is only refused at
      # upload, by which point it has cost a round trip through Play Console.
      - name: Check the bundle is signed
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | tee /tmp/verify.txt
          grep -q "jar verified" /tmp/verify.txt

      - name: Delete the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: vegdrop-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

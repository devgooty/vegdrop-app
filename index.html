<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VegDrop - Artisanal Fresh Basket</title>
    
    <!-- 📱 Progressive Web App (PWA) Config -->
    <link rel="manifest" href="/manifest.json" />
    <!--
      White, so the status bar and the Android navigation bar match the page
      instead of framing it in dark green. Android picks dark status-bar icons
      off a light theme colour on its own, so the clock stays readable.

      Must stay in step with `theme_color` in manifest.json: this tag governs a
      browser tab, the manifest governs the installed app, and a disagreement
      shows up as the bar changing colour once the app is installed.
    -->
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default` is the light bar with dark text. `black-translucent` drew the
         page under the clock, which is where the dark band at the top came
         from on iOS. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- 🔍 Rich SEO Meta Tags -->
    <meta name="description" content="Savor 100% organic, handpicked fresh vegetables and fruits. Hyperlocal 15-minute delivery at VegDrop Artisanal Basket." />
    <meta name="keywords" content="organic vegetables, fresh fruits, online grocery, 15 minute delivery, local produce" />
    <meta name="author" content="VegDrop" />

    <!-- Open Graph (Facebook/LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VegDrop - Artisanal Fresh Basket" />
    <meta property="og:description" content="Savor 100% organic, handpicked fresh vegetables and fruits delivered to your doorstep." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:url" content="https://vegdrop-app.vercel.app/" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VegDrop - Artisanal Fresh Basket" />
    <meta name="twitter:description" content="Savor 100% organic, handpicked fresh vegetables and fruits delivered to your doorstep." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Google Font Preconnect & Embedding -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      display=swap means text renders immediately in a fallback face rather than
      staying invisible while the webfont downloads.

      This was previously loaded with the `media="print" onload="this.media='all'"`
      trick to keep it off the critical path. That is an inline event handler,
      which the Content-Security-Policy the server now sends for the client
      (see server/app.js) does not allow — and buying it back would mean
      permitting inline script across the whole app, which is a far worse trade
      than one render-blocking stylesheet.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      Leaflet is NOT loaded from a CDN here. MapLocationPicker.jsx imports both
      leaflet and leaflet/dist/leaflet.css from npm, so CDN copies were a
      duplicate download of an already-bundled library plus a render-blocking
      stylesheet. It now ships inside the lazily-loaded vendor-maps chunk, which
      only the routes that render a map ever request.
    -->
  </head>
  <body class="bg-[#F8F5EF] font-sans antialiased text-[#2D2A26] selection:bg-emerald-200 selection:text-emerald-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# `-bin`, not `-all`: the same Gradle, without the sources and API docs that
# only an IDE reads. It is a third smaller, which on a slow link is the
# difference between a first build that finishes and one that times out.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
# Two minutes, not ten seconds.
#
# This is the timeout for fetching Gradle itself on a machine that does not
# have it yet — a 180 MB download over whatever connection the developer is on.
# Capacitor generates this file with Gradle's 10s default, which is a CONNECT
# timeout as well as a read one, so a slow first handshake fails the build
# before a single byte of the distribution arrives:
#
#   Downloading ... failed: timeout (10000ms)
#   Caused by: java.net.SocketTimeoutException: Connect timed out
#
# It reads as a broken build and is a slow link. Raised here rather than left
# to each person to discover, because it is the first command anyone runs.
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
